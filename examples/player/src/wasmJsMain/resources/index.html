<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>mpv-kmp player</title>
    <style>
        html, body { margin: 0; height: 100%; background: #0c0d12; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #player {
            position: fixed;
            display: none;
            background: #000;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<video id="player" playsinline></video>
<script type="module">
    // SDL owns the canvas; imgui produces the draw data the shared Kotlin
    // PlayerApp renders. The video element is positioned over the canvas by
    // the Kotlin code (see Main.kt), so the ImGui UI is the only control layer.
    import { initSdlKmp } from './sdl_kmp_glue.js';
    import { initImguiKmp } from './imgui_kmp_glue.js';

    const canvas = document.getElementById('canvas');
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    canvas.addEventListener('auxclick', (event) => {
        if (event.button === 1) event.preventDefault();
    });

    await initSdlKmp({ canvas });
    await initImguiKmp();
    await import('./mpv-kmp-examples-player.mjs');
</script>
</body>
</html>
