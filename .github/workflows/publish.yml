name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each publication is produced by exactly one
# runner:
#
#   macos-14      -> :mpv-kmp metadata + jvm + macOS klibs, plus the
#                    mpv-kmp-jni-jvm-darwin-{aarch64,x86_64} artifacts
#   ubuntu-latest -> linuxX64/linuxArm64/mingwX64 klibs, plus the
#                    mpv-kmp-jni-jvm-linux-{x86_64,aarch64} artifacts
#   ubuntu-latest -> androidNative klibs + android AAR + android-jvm AAR
#   ubuntu-latest -> wasmJs klib + the @enaium/mpv-kmp npm package
#   windows-latest -> the mpv-kmp-jni-jvm-windows-x86_64 artifact
#
# The Kotlin Multiplatform metadata module redirects to the per-target klib
# modules, so all of them must be published before consumers resolve the
# artifact.
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key
#   NPM_PUBLISH_KEY          npm token for @enaium/mpv-kmp

jobs:
  publish-macos:
    name: Publish macOS (metadata + jvm + macOS klibs)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish metadata, jvm, macOS klibs and darwin JNI artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :mpv-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
          :mpv-kmp:publishJvmPublicationToMavenCentralRepository
          :mpv-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :mpv-kmp:publishMacosX64PublicationToMavenCentralRepository
          :jni-jvm-darwin-aarch64:publishMavenPublicationToMavenCentralRepository
          :jni-jvm-darwin-x86_64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (linuxX64/linuxArm64/mingwX64 klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish Linux and MinGW klibs plus linux JNI artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :mpv-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :mpv-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :mpv-kmp:publishMingwX64PublicationToMavenCentralRepository
          :jni-jvm-linux-x86_64:publishMavenPublicationToMavenCentralRepository
          :jni-jvm-linux-aarch64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-android:
    name: Publish Android (native klibs + AARs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK and platform
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;27.0.12077973" "platforms;android-36" "cmake;3.22.1" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish androidNative klibs and Android AARs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :mpv-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :mpv-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :mpv-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          :mpv-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          :mpv-kmp:publishAndroidPublicationToMavenCentralRepository
          :android-jvm:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-web:
    name: Publish wasmJs klib + npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the wasmJs klib
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :mpv-kmp:publishWasmJsPublicationToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish the @enaium/mpv-kmp npm package
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pnpm.provenance=true
          :mpv-kmp:publishWasmNpm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}

  publish-windows:
    name: Publish Windows (windows-x86_64 JNI artifact)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish the windows-x86_64 JNI artifact
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
